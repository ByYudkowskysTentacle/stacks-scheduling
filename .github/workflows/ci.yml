# SPDX-License-Identifier: AGPL-3.0-or-later
# Lint, type-check and test on every push and pull request (ADR 0001).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stacks
          POSTGRES_PASSWORD: stacks
          POSTGRES_DB: stacks
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stacks" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: stacks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Start Keycloak for the campus sign-in tests (D118)
        # Started early so it boots while dependencies install. Synthetic realm, tests only.
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/fixtures/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.0.7 start-dev --import-realm
      - name: Install uv and dependencies
        run: |
          python -m pip install "uv==0.11.32"
          uv sync --frozen
      - name: Install Chromium for browser tests
        run: uv run playwright install --with-deps chromium
      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Type-check the domain core
        run: uv run pyright
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run --settings=app.config.test_settings
      - name: Wait for Keycloak
        run: |
          timeout 180 sh -c 'until curl -fsS http://localhost:8080/realms/stacks-test/.well-known/openid-configuration >/dev/null; do sleep 3; done' \
            || { docker logs keycloak | tail -50; exit 1; }
      - name: Tests
        env:
          REQUIRE_BROWSER: "1"
          KEYCLOAK_URL: http://localhost:8080
          REQUIRE_KEYCLOAK: "1"
        run: uv run pytest -q -m "not slow"

  engine:
    # Real solves for the acceptance scenarios (SPEC §12). Slower, so in their own job.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stacks
          POSTGRES_PASSWORD: stacks
          POSTGRES_DB: stacks
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stacks" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: stacks
      ENGINE_TEST_TIME_SCALE: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv and dependencies
        run: |
          python -m pip install "uv==0.11.32"
          uv sync --frozen
      - name: Engine acceptance scenarios
        run: uv run pytest -q -m slow

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image
        run: docker build --target prod -t stacks:ci .
      - name: Compose file is valid
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' .env
          docker compose config --quiet
