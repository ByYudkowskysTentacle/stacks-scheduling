# Secrets and personal-data guard (CLAUDE.md sections 2.1 and 6). Runs on every push and pull
# request, so commits made without the local hook (.githooks/pre-commit) are still checked.
name: Sensitive data check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so gitleaks sees every commit

      - name: Secrets (gitleaks, full history)
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner --verbose /repo

      - name: Personal data (tracked files)
        run: python3 tools/check_sensitive.py --all
