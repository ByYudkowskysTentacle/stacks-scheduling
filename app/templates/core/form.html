{% extends "base.html" %}
{% block content %}
{% if request.path|slice:":10" == "/settings/" %}{% include "core/settings_nav.html" %}{% endif %}
<h1>{{ title }}</h1>
<form method="post" class="stacked-form" novalidate>
  {% csrf_token %}
  {{ form.as_div }}
  <div class="form-actions">
    <button type="submit" class="button button--primary">Save</button>
    <a href="{{ cancel_url|default:'/' }}" class="button">Cancel</a>
    {% if delete_url %}<a href="{{ delete_url }}" class="button button--danger-outline">Remove</a>{% endif %}
  </div>
</form>
{% endblock %}
